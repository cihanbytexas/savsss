<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SavStudio | Data Editor</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css?v=rollback1">
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">SavStudio</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div id="toast-container" class="toast hidden"></div>

    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" data-i18n="modal_title">Hex Değerini Düzenle</h3>
            <p id="modal-desc" class="modal-desc"></p>
            <input type="text" id="modal-input" maxlength="2" autocomplete="off">
            <div class="modal-actions">
                <button class="btn outline-btn" id="modal-cancel" data-i18n="modal_cancel">İPTAL</button>
                <button class="btn primary-btn" id="modal-save" data-i18n="modal_save">KAYDET</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">SavStudio</div>
        <div class="nav-actions">
            <button class="btn outline-btn icon-btn" id="btn-undo" data-i18n-title="undo" title="Geri Al" disabled><i class="ph-bold ph-arrow-u-up-left"></i></button>
            <button class="btn outline-btn icon-btn" id="btn-redo" data-i18n-title="redo" title="İleri Al" disabled><i class="ph-bold ph-arrow-u-up-right"></i></button>
            
            <div class="divider"></div>
            <button class="btn lang-btn" id="lang-toggle">EN</button>
            
            <label class="btn primary-btn">
                <i class="ph-bold ph-upload-simple"></i> <span data-i18n="upload_btn" class="hide-mobile">DOSYA YÜKLE</span>
                <input type="file" id="upload-save" accept=".sav" style="display: none;">
            </label>
            <button class="btn outline-btn" id="download-save" disabled>
                <i class="ph-bold ph-download-simple"></i> <span data-i18n="download_btn" class="hide-mobile">KAYDET</span>
            </button>
        </div>
    </nav>

    <main class="workspace">
        <aside class="sidebar">
            <div class="file-info" id="file-info">
                <strong data-i18n="active_file">Aktif Dosya</strong><br><br>
                <span style="color: var(--text-muted);" data-i18n="no_file">Henüz dosya seçilmedi.</span>
            </div>
            
            <div class="compare-info" id="compare-section" style="display: none; margin-top: 15px; padding: 15px; border: 1px solid var(--border-color); background: var(--bg-base); border-radius: 2px;">
                <label class="btn outline-btn" style="width: 100%; justify-content: center; font-size: 0.75rem;">
                    <i class="ph-bold ph-git-diff"></i> <span data-i18n="compare_btn">KARŞILAŞTIR</span>
                    <input type="file" id="upload-compare" accept=".sav" style="display: none;">
                </label>
                <div id="compare-details" style="display: none; margin-top: 15px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.8;">
                </div>
            </div>
        </aside>

        <section class="editor-area">
            <div id="editor-wrapper" style="display: flex; flex-direction: column; flex: 1; height: 100%;">
                <div class="tabs">
                    <button class="tab active" data-target="smart-view">
                        <i class="ph-bold ph-list-numbers"></i> <span data-i18n="tab_values">Değerler</span>
                    </button>
                    <button class="tab" data-target="hex-view">
                        <i class="ph-bold ph-hash"></i> <span data-i18n="tab_hex">Hex Editör</span>
                    </button>
                </div>

                <div class="view-content active" id="smart-view">
                    <div class="empty-state" id="empty-message">
                        <i class="ph-duotone ph-file-dashed"></i>
                        <p data-i18n="empty_msg">Düzenlemeye başlamak için bir dosya yükleyin.</p>
                    </div>
                    <div id="smart-editor-container" style="display: none;">
                        <div class="search-box">
                            <i class="ph-bold ph-magnifying-glass"></i>
                            <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="Arama yap...">
                        </div>
                        <div class="smart-list" id="smart-list"></div>
                    </div>
                </div>

                <div class="view-content" id="hex-view">
                    <div class="search-box hex-search-bar" id="hex-search-container" style="display: none; margin-bottom: 20px;">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="hex-search-input" data-i18n-placeholder="hex_search_placeholder" placeholder="Hex veya Metin arat...">
                        <button id="hex-search-btn" class="btn primary-btn" style="padding: 6px 16px; margin-left: 10px;" data-i18n="search_btn">BUL</button>
                    </div>
                    <div class="hex-editor-container">
                        <div class="hex-header">
                            <div class="hex-offset-col" data-i18n="offset">Offset</div>
                            <div class="hex-bytes-col">00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F</div>
                            <div class="hex-ascii-col" data-i18n="ascii">ASCII</div>
                        </div>
                        <div class="hex-body" id="hex-body">
                            <div class="empty-state"><p data-i18n="empty_msg">Düzenlemeye başlamak için bir dosya yükleyin.</p></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                if(splash) { splash.style.opacity = '0'; setTimeout(() => splash.style.display = 'none', 500); }
            }, 600);
        });
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js?v=rollback1').catch(err => console.error(err));
        }
    </script>
    <script src="app.js?v=rollback1"></script>
</body>
</html>
