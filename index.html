<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveMaster - SaveEditOnline Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-base: #202225; --bg-panel: #2f3136; --border-color: #40444b;
            --text-main: #dcddde; --text-muted: #8e9297; --accent-color: #5865F2; --success-color: #43b581;
            --font-ui: 'Inter', sans-serif; --font-mono: 'Fira Code', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .navbar { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .logo { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text-main); }
        .nav-actions { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 4px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; border: none; font-size: 0.85rem; transition: 0.2s; }
        .primary-btn { background: var(--success-color); color: white; }
        .primary-btn:hover { background: #3ca374; }
        .success-btn { background: var(--accent-color); color: white; }
        .success-btn:disabled { background: #4f545c; color: #72767d; cursor: not-allowed; }

        .workspace { display: flex; flex: 1; overflow: hidden; flex-direction: column; }
        @media (min-width: 768px) { .workspace { flex-direction: row; } }
        
        .sidebar { width: 100%; padding: 20px; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); }
        @media (min-width: 768px) { .sidebar { width: 280px; border-bottom: none; border-right: 1px solid var(--border-color); } }
        .file-info { font-size: 0.85rem; padding: 16px; border-radius: 8px; background: #292b2f; line-height: 1.8; color: var(--text-muted); }
        .file-info strong { color: var(--text-main); }

        .editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-base); overflow: hidden; }
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-panel); flex-shrink: 0; }
        .tab { padding: 14px 20px; background: transparent; border: none; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .tab.active { color: white; border-bottom: 2px solid var(--accent-color); background: #36393f;}

        .view-content { flex: 1; overflow-y: auto; padding: 20px; display: none; }
        .view-content.active { display: block; }
        .empty-state { text-align: center; color: var(--text-muted); margin-top: 15vh; }
        .empty-state i { font-size: 4rem; opacity: 0.3; margin-bottom: 15px; }

        /* SaveEditOnline Birebir Tasarımı */
        .smart-list { max-width: 800px; margin: 0 auto; padding-bottom: 40px; }
        .smart-item { display: flex; justify-content: flex-end; align-items: center; padding: 10px 16px; border-bottom: 1px solid #2f3136; transition: 0.1s; }
        .smart-item:hover { background: #32353b; }
        
        .smart-left { display: flex; align-items: center; justify-content: flex-end; flex: 1; overflow: hidden; padding-right: 15px; }
        .smart-offset { font-family: var(--font-mono); font-size: 0.75rem; color: #72767d; margin-right: 8px; }
        .smart-name { font-family: var(--font-mono); font-size: 0.85rem; color: #b9bbbe; }
        
        .smart-input { background: transparent; border: none; color: var(--success-color); padding: 4px 8px; border-radius: 4px; font-family: var(--font-mono); font-weight: 600; font-size: 0.95rem; width: 150px; text-align: left; }
        .smart-input:focus { outline: none; background: #18191c; }
        
        .search-box { width: 100%; max-width: 800px; margin: 0 auto 20px auto; display: flex; align-items: center; background: #202225; border: 1px solid var(--border-color); border-radius: 4px; padding: 0 12px; }
        .search-box i { color: var(--text-muted); }
        .search-box input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-family: var(--font-ui); }
        .search-box input:focus { outline: none; }

        /* Hex Editör (Yedek) */
        .hex-editor-container { font-family: var(--font-mono); font-size: 0.85rem; height: 100%; display: flex; flex-direction: column; }
        .hex-header { display: flex; color: var(--text-muted); font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); margin-bottom: 10px; }
        .hex-body { flex: 1; overflow-y: auto; }
        .hex-row { display: flex; padding: 4px 0; }
        .hex-row:hover { background: #32353b; }
        .hex-offset-col { width: 80px; color: #72767d; user-select: none; }
        .hex-bytes-col { flex: 1; display: flex; gap: 8px; color: #a5b4fc; }
        .hex-ascii-col { width: 160px; color: #b9bbbe; letter-spacing: 2px; overflow: hidden; white-space: nowrap; }
        .hex-byte { cursor: pointer; padding: 0 2px; border-radius: 2px; }
        .hex-byte:hover { background: var(--accent-color); color: white; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">SaveMaster</div>
        <div class="nav-actions">
            <label class="btn primary-btn">
                <i class="ph-bold ph-upload-simple"></i> DOSYA YÜKLE
                <input type="file" id="upload-save" accept=".sav" style="display: none;">
            </label>
            <button class="btn success-btn" id="download-save" disabled>
                <i class="ph-bold ph-download-simple"></i> GÜNCELLENMİŞ DOSYAYI İNDİR
            </button>
        </div>
    </nav>

    <main class="workspace">
        <aside class="sidebar">
            <div class="file-info" id="file-info">
                <strong>Aktif Dosya</strong><br><br>
                <span style="color: #72767d;">Henüz dosya seçilmedi. Düzenlemek için .sav uzantılı bir dosya yükleyin.</span>
            </div>
        </aside>

        <section class="editor-area">
            <div class="tabs">
                <button class="tab active" data-target="smart-view"><i class="ph-bold ph-list-numbers"></i> Değerler (Values)</button>
                <button class="tab" data-target="hex-view"><i class="ph-bold ph-hash"></i> Hex Editör</button>
            </div>

            <div class="view-content active" id="smart-view">
                <div class="empty-state" id="empty-message">
                    <i class="ph-duotone ph-file-dashed"></i>
                    <p>PUBG Active.sav dosyasını yükleyin.</p>
                </div>
                <div id="smart-editor-container" style="display: none;">
                    <div class="search-box">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Arama yap... (Örn: TotalShoot, FPSLevel)">
                    </div>
                    <div class="smart-list" id="smart-list"></div>
                </div>
            </div>

            <div class="view-content" id="hex-view">
                <div class="hex-editor-container">
                    <div class="hex-header">
                        <div class="hex-offset-col">Offset</div>
                        <div class="hex-bytes-col">00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F</div>
                        <div class="hex-ascii-col">ASCII</div>
                    </div>
                    <div class="hex-body" id="hex-body">
                        <div class="empty-state"><p>Dosya yüklenmedi.</p></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const uploadInput = document.getElementById("upload-save");
            const downloadBtn = document.getElementById("download-save");
            const fileInfo = document.getElementById("file-info");
            const smartList = document.getElementById("smart-list");
            const emptyMsg = document.getElementById("empty-message");
            const editorContainer = document.getElementById("smart-editor-container");
            const searchInput = document.getElementById("search-input");
            const tabs = document.querySelectorAll(".tab");
            const views = document.querySelectorAll(".view-content");

            let fileBuffer = null; 
            let dataView = null;
            let uint8Array = null;
            let currentFileName = "";

            // Sekme Değiştirme
            tabs.forEach(tab => {
                tab.addEventListener("click", () => {
                    tabs.forEach(t => t.classList.remove("active"));
                    views.forEach(v => v.classList.remove("active"));
                    tab.classList.add("active");
                    document.getElementById(tab.dataset.target).classList.add("active");
                });
            });

            uploadInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                currentFileName = file.name;
                const reader = new FileReader();
                reader.onload = (event) => {
                    fileBuffer = event.target.result;
                    dataView = new DataView(fileBuffer);
                    uint8Array = new Uint8Array(fileBuffer);
                    
                    fileInfo.innerHTML = `
                        <strong>Dosya:</strong> <span style="color:#fff">${file.name}</span> <br>
                        <strong>Boyut:</strong> <span style="color:#fff">${(file.size / 1024).toFixed(2)} KB</span> <br>
                        <strong>Durum:</strong> İşleniyor...
                    `;
                    
                    emptyMsg.style.display = "none";
                    editorContainer.style.display = "block";
                    downloadBtn.disabled = false;

                    setTimeout(() => {
                        extractPropertiesBulletproof();
                        renderHexEditor();
                    }, 50);
                };
                reader.readAsArrayBuffer(file); 
            });

            // KURŞUN GEÇİRMEZ TARAYICI (Bayt eşleşmesi ile)
            function extractPropertiesBulletproof() {
                // HATA BURADAYDI: TextDecoder string uzunluğunu bozuyordu. 
                // Artık baytları BİREBİR string'e çeviriyoruz. İndeksler %100 uyuşacak.
                let rawStr = "";
                for (let i = 0; i < uint8Array.length; i++) {
                    rawStr += String.fromCharCode(uint8Array[i]);
                }
                
                let properties = [];
                // UE4 GVAS Dosyaları İçin Tam Ofset Değerleri
                const types = [
                    { type: "IntProperty", offsetAdd: 21 },
                    { type: "FloatProperty", offsetAdd: 23 },
                    { type: "BoolProperty", offsetAdd: 21 }
                ];

                types.forEach(t => {
                    let index = 0;
                    while ((index = rawStr.indexOf(t.type, index)) !== -1) {
                        try {
                            // İsmi geriye doğru tarayarak bul
                            let i = index - 1;
                            // Boşlukları ve gereksiz uzunluk baytlarını atla
                            while (i > 0 && !(/[a-zA-Z0-9_]/.test(rawStr[i]))) { i--; }
                            let nameEnd = i;
                            // Alfanumerik karakterler bitene kadar geri git (İsmi al)
                            while (i > 0 && (/[a-zA-Z0-9_]/.test(rawStr[i]))) { i--; }
                            let nameStart = i + 1;

                            let varName = rawStr.substring(nameStart, nameEnd + 1);

                            if (varName.length >= 2) {
                                // Tam değer ofsetini hesapla
                                const valueOffset = index + t.offsetAdd; 
                                
                                if (valueOffset + 4 <= uint8Array.length) {
                                    properties.push({ name: varName, type: t.type, offset: valueOffset });
                                }
                            }
                        } catch(e) {}
                        index += t.type.length;
                    }
                });

                renderList(properties);
            }

            function renderList(properties) {
                smartList.innerHTML = "";
                
                if(properties.length === 0) {
                    smartList.innerHTML = `<p style='color:#ed4245; text-align:center; padding: 40px;'>Bu dosyada okunabilir değer bulunamadı.<br><br>Yüksek ihtimalle şifreli bir Config dosyası. Hex Editör sekmesini kullanın.</p>`;
                    fileInfo.innerHTML = fileInfo.innerHTML.replace("İşleniyor...", `<span style="color:#ed4245">Okuma Başarısız</span>`);
                    return;
                }

                fileInfo.innerHTML = fileInfo.innerHTML.replace("İşleniyor...", `<span style="color:var(--success-color)">Başarılı (${properties.length} Değer)</span>`);
                
                // SaveEditOnline gibi sıraya diz
                properties.sort((a, b) => a.offset - b.offset);

                properties.forEach((prop) => {
                    const item = document.createElement("div");
                    item.className = "smart-item";
                    let currentValue = 0; let step = "1";
                    
                    // Baytları Okuma
                    try {
                        if (prop.type === "IntProperty") {
                            currentValue = dataView.getInt32(prop.offset, true); step = "1";
                        } else if (prop.type === "FloatProperty") {
                            let fVal = dataView.getFloat32(prop.offset, true);
                            // Küsuratı çok olanları SaveEditOnline gibi uzun göster, tam sayıları temizle
                            currentValue = Number.isInteger(fVal) ? fVal : fVal.toFixed(16).replace(/\.?0+$/, ''); 
                            step = "0.01";
                        } else if (prop.type === "BoolProperty") {
                            currentValue = dataView.getUint8(prop.offset) === 1 ? 1 : 0; step = "1";
                        }
                    } catch(e) { currentValue = 0; }

                    item.innerHTML = `
                        <div class="smart-left">
                            <span class="smart-offset">[${prop.offset}]</span>
                            <span class="smart-name" title="${prop.name}">> ${prop.name}</span>
                        </div>
                        <input type="number" class="smart-input" step="${step}" value="${currentValue}" data-offset="${prop.offset}" data-type="${prop.type}">
                    `;
                    smartList.appendChild(item);
                });

                // Değerleri RAM'e Yazma (Kaydetme)
                document.querySelectorAll(".smart-input").forEach(input => {
                    input.addEventListener("change", (e) => {
                        const offset = parseInt(e.target.dataset.offset);
                        const type = e.target.dataset.type;
                        let newVal = Number(e.target.value);
                        try {
                            if (type === "IntProperty") dataView.setInt32(offset, newVal, true);
                            else if (type === "FloatProperty") dataView.setFloat32(offset, newVal, true);
                            else if (type === "BoolProperty") {
                                newVal = newVal > 0 ? 1 : 0;
                                dataView.setUint8(offset, newVal);
                                e.target.value = newVal; 
                            }
                            // Düzenlendiğini belirtmek için rengi turuncu yap
                            e.target.style.color = "#faa61a"; 
                            renderHexEditor(); 
                        } catch(err) {}
                    });
                });
            }

            function renderHexEditor() {
                const hexBody = document.getElementById("hex-body");
                hexBody.innerHTML = ""; 
                const maxBytesToRender = Math.min(uint8Array.length, 16384); 
                let htmlContent = "";
                
                for (let i = 0; i < maxBytesToRender; i += 16) {
                    let hexRow = `<div class="hex-row">`;
                    hexRow += `<div class="hex-offset-col">${i.toString(16).padStart(8, '0').toUpperCase()}</div>`;
                    let hexBytes = ""; let asciiChars = "";
                    
                    for (let j = 0; j < 16; j++) {
                        if (i + j < maxBytesToRender) {
                            const byte = uint8Array[i + j];
                            const hexValue = byte.toString(16).padStart(2, '0').toUpperCase();
                            hexBytes += `<span class="hex-byte" data-index="${i+j}" title="Düzenle">${hexValue}</span> `;
                            asciiChars += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : ".";
                        } else {
                            hexBytes += "   "; 
                        }
                    }
                    hexRow += `<div class="hex-bytes-col">${hexBytes}</div>`;
                    asciiChars = asciiChars.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    hexRow += `<div class="hex-ascii-col">${asciiChars}</div>`;
                    hexRow += `</div>`;
                    htmlContent += hexRow;
                }
                hexBody.innerHTML = htmlContent;

                document.querySelectorAll('.hex-byte').forEach(span => {
                    span.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        const currentHex = this.innerText;
                        const newHex = prompt(`Adres: 0x${index.toString(16).toUpperCase()}\nMevcut: ${currentHex}\nYeni (00-FF):`, currentHex);
                        
                        if (newHex && /^[0-9A-Fa-f]{1,2}$/.test(newHex)) {
                            uint8Array[index] = parseInt(newHex, 16); 
                            this.innerText = newHex.padStart(2, '0').toUpperCase(); 
                            this.style.color = "#faa61a"; 
                            extractPropertiesBulletproof(); 
                        }
                    });
                });
            }

            searchInput.addEventListener("input", (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll(".smart-item").forEach(item => {
                    const name = item.querySelector(".smart-name").innerText.toLowerCase();
                    item.style.display = name.includes(term) ? "flex" : "none";
                });
            });

            downloadBtn.addEventListener("click", () => {
                const blob = new Blob([fileBuffer], { type: "application/octet-stream" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url; a.download = "edited_" + currentFileName;
                document.body.appendChild(a); a.click();
                setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
            });
        });
    </script>
</body>
</html>
