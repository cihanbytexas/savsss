<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaveMaster - Gelişmiş Kayıt Editörü (GVAS Destekli)</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        :root {
            --bg-base: #0f111a;
            --bg-panel: #161925;
            --bg-glass: rgba(22, 25, 37, 0.8);
            --border-color: #2b3041;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --success-color: #10b981;
            --font-ui: 'Inter', sans-serif;
            --font-mono: 'Fira Code', monospace;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .glass {
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        /* Navbar */
        .navbar {
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            border-bottom: 1px solid var(--border-color);
        }
        .logo { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--accent-color); }
        .nav-actions { display: flex; gap: 12px; }

        /* Butonlar */
        .btn {
            padding: 8px 16px; border-radius: 6px; font-family: var(--font-ui); font-size: 0.85rem; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 6px; border: none; transition: var(--transition);
        }
        .primary-btn { background: var(--accent-color); color: white; }
        .primary-btn:hover { filter: brightness(1.1); }
        .success-btn { background: var(--success-color); color: white; }
        .success-btn:disabled { background: #334155; color: #94a3b8; cursor: not-allowed; }
        .outline-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); width: 100%; justify-content: center; margin-bottom: 8px; }
        .outline-btn:hover { background: var(--border-color); }

        /* Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 300px; padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .panel-header h3 { font-size: 0.75rem; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 12px; }
        .file-info { font-size: 0.85rem; background: var(--bg-base); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); line-height: 1.6;}

        .editor-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-panel); }

        /* Sekmeler */
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-base); }
        .tab {
            padding: 12px 20px; background: transparent; border: none; color: var(--text-muted); font-weight: 500;
            cursor: pointer; border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 8px;
        }
        .tab.active { color: var(--accent-color); border-bottom-color: var(--accent-color); background: var(--bg-panel); }

        /* Editör İçerikleri */
        .view-content { flex: 1; display: none; overflow: auto; position: relative; }
        .view-content.active { display: block; }
        .empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: var(--text-muted); }
        .empty-state i { font-size: 3rem; margin-bottom: 10px; opacity: 0.5; }

        /* Visual Editor (Tree) */
        .visual-editor-container { padding: 20px; }
        .kv-row { display: flex; align-items: center; margin-bottom: 8px; font-family: var(--font-mono); font-size: 0.85rem; }
        .kv-key { width: 200px; color: #818cf8; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kv-val-input { 
            flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); 
            padding: 6px 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem;
        }
        .kv-val-input:focus { border-color: var(--accent-color); outline: none; }
        .kv-object-title { margin: 12px 0 8px 0; color: #f8fafc; font-weight: 600; padding-bottom: 4px; border-bottom: 1px dashed var(--border-color); }
        .kv-indent { margin-left: 20px; border-left: 1px solid var(--border-color); padding-left: 15px; }

        /* Raw Code Editor */
        .code-editor {
            width: 100%; height: 100%; background: transparent; border: none; color: #a5b4fc;
            padding: 20px; font-family: var(--font-mono); font-size: 0.9rem; resize: none; line-height: 1.5;
        }
        .code-editor:focus { outline: none; }

        /* Hex Editör Tasarımı */
        .hex-editor-container {
            padding: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .hex-header {
            display: flex;
            color: var(--accent-color);
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 10px;
        }
        .hex-body {
            flex: 1;
            overflow-y: auto;
        }
        .hex-row {
            display: flex;
            padding: 4px 0;
            transition: background 0.1s;
        }
        .hex-row:hover { background: rgba(255,255,255,0.05); }
        .hex-offset-col { width: 80px; color: var(--text-muted); user-select: none; }
        .hex-bytes-col { flex: 1; display: flex; gap: 8px; color: #a5b4fc; }
        .hex-ascii-col { width: 160px; color: #f8fafc; letter-spacing: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        .hex-byte { cursor: pointer; padding: 0 2px; border-radius: 2px; }
        .hex-byte:hover { background: var(--accent-color); color: white; }
    </style>
</head>
<body>

    <nav class="navbar glass">
        <div class="logo">
            <i class="ph-fill ph-floppy-disk"></i>
            <span>SaveMaster</span>
        </div>
        <div class="nav-actions">
            <label class="btn primary-btn">
                <i class="ph ph-upload-simple"></i> Save Dosyası Yükle
                <input type="file" id="upload-save" style="display: none;">
            </label>
            <button class="btn success-btn" id="download-save" disabled>
                <i class="ph ph-download-simple"></i> Düzenlenmiş Save'i İndir
            </button>
        </div>
    </nav>

    <main class="workspace">
        <aside class="sidebar panel glass">
            <div class="panel-header"><h3>DOSYA BİLGİSİ</h3></div>
            <div class="file-info" id="file-info">
                <p class="text-muted">Henüz dosya yüklenmedi.</p>
            </div>
            
            <div class="panel-header" style="margin-top: 20px;"><h3>ARAÇLAR</h3></div>
            <div class="tools-menu">
                <button class="btn outline-btn" id="btn-base64-decode"><i class="ph ph-lock-key-open"></i> Base64 Çöz</button>
                <button class="btn outline-btn" id="btn-format-json"><i class="ph ph-brackets-curly"></i> JSON Formatla</button>
            </div>
        </aside>

        <section class="editor-area panel">
            <div class="tabs">
                <button class="tab" data-target="visual-view"><i class="ph ph-tree-structure"></i> Görsel Editör</button>
                <button class="tab" data-target="raw-view"><i class="ph ph-code"></i> Metin (Raw)</button>
                <button class="tab active" data-target="hex-view"><i class="ph ph-hash"></i> Hex Editör (GVAS/Binary)</button>
            </div>

            <div class="view-content" id="visual-view">
                <div class="visual-editor-container" id="visual-editor">
                    <div class="empty-state">
                        <i class="ph ph-file-dashed"></i>
                        <p>Düzenlemek için bir dosya yükleyin.</p>
                    </div>
                </div>
            </div>

            <div class="view-content" id="raw-view">
                <textarea id="raw-editor" class="code-editor" spellcheck="false" placeholder="Dosya içeriği burada görünecek..."></textarea>
            </div>

            <div class="view-content active" id="hex-view">
                <div class="hex-editor-container">
                    <div class="hex-header">
                        <div class="hex-offset-col">Offset</div>
                        <div class="hex-bytes-col">00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F</div>
                        <div class="hex-ascii-col">ASCII</div>
                    </div>
                    <div class="hex-body" id="hex-body">
                        <div class="empty-state">
                            <i class="ph ph-binary"></i>
                            <p>Binary veya GVAS formatında bir dosya yükleyin.</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const uploadInput = document.getElementById("upload-save");
            const downloadBtn = document.getElementById("download-save");
            const fileInfo = document.getElementById("file-info");
            const tabs = document.querySelectorAll(".tab");
            const views = document.querySelectorAll(".view-content");
            const visualEditor = document.getElementById("visual-editor");
            const rawEditor = document.getElementById("raw-editor");
            
            let currentFileName = "";
            let fileBuffer = null; 
            let uint8Array = null; 
            let isGVAS = false;
            let currentData = null; // JSON datası için
            let isJson = false;

            // --- Tab Değiştirme ---
            tabs.forEach(tab => {
                tab.addEventListener("click", () => {
                    tabs.forEach(t => t.classList.remove("active"));
                    views.forEach(v => v.classList.remove("active"));
                    tab.classList.add("active");
                    document.getElementById(tab.dataset.target).classList.add("active");
                });
            });

            // --- Dosyayı ArrayBuffer Olarak Okuma ---
            uploadInput.addEventListener("change", (e) => {
                const file = e.target.files[0];
                if (!file) return;

                currentFileName = file.name;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    fileBuffer = event.target.result;
                    uint8Array = new Uint8Array(fileBuffer);
                    processFile(file);
                };
                reader.readAsArrayBuffer(file); 
            });

            // --- Dosya Tipi Analizi (GVAS veya Text/JSON) ---
            function processFile(file) {
                downloadBtn.disabled = false;
                isGVAS = false;
                isJson = false;
                currentData = null;
                
                // İlk 4 baytı kontrol et (GVAS Magic Number)
                if (uint8Array.length >= 4) {
                    const magic = String.fromCharCode(uint8Array[0], uint8Array[1], uint8Array[2], uint8Array[3]);
                    if (magic === 'GVAS') isGVAS = true;
                }

                fileInfo.innerHTML = `
                    <strong>Dosya:</strong> ${file.name} <br>
                    <strong>Boyut:</strong> ${(file.size / 1024).toFixed(2)} KB <br>
                `;

                if (isGVAS) {
                    fileInfo.innerHTML += `<strong>Format:</strong> <span style="color:var(--success-color)">UE4 GVAS (Binary)</span>`;
                    document.querySelector('[data-target="hex-view"]').click();
                    renderHexEditor();
                    rawEditor.value = "Bu bir GVAS (Binary) dosyasıdır. Düzenlemek için Hex Editör sekmesini kullanın.";
                    visualEditor.innerHTML = `<div class="empty-state"><p>Binary dosyalar görsel editörde açılamaz.</p></div>`;
                } else {
                    // Metin dosyası ise Text Decoder ile çevir
                    const textDecoder = new TextDecoder("utf-8");
                    const textContent = textDecoder.decode(uint8Array);
                    rawEditor.value = textContent;

                    try {
                        currentData = JSON.parse(textContent);
                        isJson = true;
                        fileInfo.innerHTML += `<strong>Format:</strong> <span style="color:var(--accent-color)">JSON</span>`;
                        renderVisualEditor(currentData, visualEditor);
                        document.querySelector('[data-target="visual-view"]').click();
                    } catch (error) {
                        fileInfo.innerHTML += `<strong>Format:</strong> <span style="color:#f59e0b">Bilinmeyen (Metin)</span>`;
                        document.querySelector('[data-target="raw-view"]').click();
                        visualEditor.innerHTML = `<div class="empty-state"><p>Bu dosya formatı görsel editör tarafından desteklenmiyor.</p></div>`;
                    }
                    
                    // Hex editörü yine de doldur (isteyen metni hex olarak görebilsin)
                    renderHexEditor();
                }
            }

            // --- Hex Editör Oluşturucu ---
            function renderHexEditor() {
                const hexBody = document.getElementById("hex-body");
                hexBody.innerHTML = ""; 

                // Arayüzün çökmemesi için maksimum 16KB render (Geliştirilebilir)
                const maxBytesToRender = Math.min(uint8Array.length, 16384); 
                let htmlContent = "";
                
                for (let i = 0; i < maxBytesToRender; i += 16) {
                    let hexRow = `<div class="hex-row">`;
                    hexRow += `<div class="hex-offset-col">${i.toString(16).padStart(8, '0').toUpperCase()}</div>`;
                    
                    let hexBytes = "";
                    let asciiChars = "";
                    
                    for (let j = 0; j < 16; j++) {
                        if (i + j < maxBytesToRender) {
                            const byte = uint8Array[i + j];
                            const hexValue = byte.toString(16).padStart(2, '0').toUpperCase();
                            hexBytes += `<span class="hex-byte" data-index="${i+j}" title="Değiştirmek için tıkla">${hexValue}</span> `;
                            asciiChars += (byte >= 32 && byte <= 126) ? String.fromCharCode(byte) : ".";
                        } else {
                            hexBytes += "   "; 
                        }
                    }
                    
                    hexRow += `<div class="hex-bytes-col">${hexBytes}</div>`;
                    asciiChars = asciiChars.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    hexRow += `<div class="hex-ascii-col">${asciiChars}</div>`;
                    hexRow += `</div>`;
                    htmlContent += hexRow;
                }
                
                if(uint8Array.length > 16384) {
                   htmlContent += `<div style="padding: 10px; color: var(--text-muted); text-align: center;">Dosya çok büyük. Sadece ilk 16KB gösteriliyor.</div>`;
                }

                hexBody.innerHTML = htmlContent;

                // Bayt Değiştirme Tıklaması
                document.querySelectorAll('.hex-byte').forEach(span => {
                    span.addEventListener('click', function() {
                        const index = parseInt(this.getAttribute('data-index'));
                        const currentHex = this.innerText;
                        const newHex = prompt(`Adres: 0x${index.toString(16).toUpperCase()}\nMevcut Değer: ${currentHex}\nYeni değeri girin (00 - FF):`, currentHex);
                        
                        if (newHex && /^[0-9A-Fa-f]{1,2}$/.test(newHex)) {
                            const newByte = parseInt(newHex, 16);
                            uint8Array[index] = newByte; 
                            this.innerText = newHex.padStart(2, '0').toUpperCase(); 
                            this.style.color = "var(--success-color)"; 
                        } else if (newHex !== null) {
                            alert("Sadece geçerli bir Hex değeri girin! (Örn: 0A, FF, 12)");
                        }
                    });
                });
            }

            // --- JSON Görsel Editör Oluşturucu ---
            function renderVisualEditor(data, container) {
                container.innerHTML = ""; 
                function createNode(obj, currentPath, parentElement) {
                    for (let key in obj) {
                        if (obj.hasOwnProperty(key)) {
                            const value = obj[key];
                            const newPath = currentPath ? `${currentPath}.${key}` : key;

                            if (typeof value === 'object' && value !== null) {
                                const title = document.createElement("div");
                                title.className = "kv-object-title";
                                title.innerText = key;
                                parentElement.appendChild(title);

                                const indent = document.createElement("div");
                                indent.className = "kv-indent";
                                parentElement.appendChild(indent);

                                createNode(value, newPath, indent);
                            } else {
                                const row = document.createElement("div");
                                row.className = "kv-row";

                                const label = document.createElement("div");
                                label.className = "kv-key";
                                label.innerText = key;

                                const input = document.createElement("input");
                                input.type = typeof value === 'number' ? 'number' : 'text';
                                input.className = "kv-val-input";
                                input.value = value;
                                
                                input.addEventListener("input", (e) => {
                                    let val = e.target.value;
                                    if(typeof value === 'number') val = Number(val);
                                    if(typeof value === 'boolean') val = val === 'true';
                                    
                                    // Deep update
                                    const keys = newPath.split('.');
                                    const lastKey = keys.pop();
                                    const deepObj = keys.reduce((o, k) => o[k], currentData);
                                    deepObj[lastKey] = val;
                                });

                                row.appendChild(label);
                                row.appendChild(input);
                                parentElement.appendChild(row);
                            }
                        }
                    }
                }
                const rootDiv = document.createElement("div");
                createNode(data, "", rootDiv);
                container.appendChild(rootDiv);
            }

            // --- Araçlar ---
            document.getElementById("btn-base64-decode").addEventListener("click", () => {
                try {
                    const decodedStr = atob(rawEditor.value);
                    const bytes = new Uint8Array(decodedStr.length);
                    for (let i = 0; i < decodedStr.length; i++) {
                        bytes[i] = decodedStr.charCodeAt(i);
                    }
                    fileBuffer = bytes.buffer;
                    uint8Array = bytes;
                    processFile({name: currentFileName + "_decoded", size: bytes.length});
                } catch (e) {
                    alert("Bu geçerli bir Base64 dizgesi değil!");
                }
            });

            document.getElementById("btn-format-json").addEventListener("click", () => {
                try {
                    const parsed = JSON.parse(rawEditor.value);
                    rawEditor.value = JSON.stringify(parsed, null, 4);
                } catch (e) {
                    alert("Formatlamak için geçerli bir JSON olmalı!");
                }
            });

            // --- Kaydet ve İndir ---
            downloadBtn.addEventListener("click", () => {
                let blob;
                
                // Hangi sekmenin aktif olduğuna göre indirme mantığını belirle
                const activeTab = document.querySelector('.tab.active').dataset.target;

                if (isGVAS || activeTab === "hex-view") {
                    // Binary dosyasıysa güncellenmiş Array'i indir
                    blob = new Blob([uint8Array], { type: "application/octet-stream" });
                } else if (isJson && activeTab === "visual-view") {
                    // JSON ise görsel editörden veriyi al
                    blob = new Blob([JSON.stringify(currentData, null, 4)], { type: "application/json" });
                } else {
                    // Raw metin ise textarea'yı al
                    blob = new Blob([rawEditor.value], { type: "text/plain" });
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = "edited_" + currentFileName;
                document.body.appendChild(a);
                a.click();
                
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 0);
            });
        });
    </script>
</body>
</html>
