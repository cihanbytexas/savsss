<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavStudio | Data Editor</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-logo">SavStudio</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 id="modal-title" data-i18n="modal_title">Hex Değerini Düzenle</h3>
            <p id="modal-desc" class="modal-desc"></p>
            <input type="text" id="modal-input" maxlength="2" autocomplete="off">
            
            <input type="text" id="modal-bookmark-input" data-i18n-placeholder="modal_bookmark_ph" placeholder="Yer imi adı (Opsiyonel)" style="width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); padding: 10px; font-family: var(--font-ui); font-size: 0.85rem; margin-bottom: 20px; outline: none; border-radius: 2px;">

            <div class="modal-actions">
                <button class="btn outline-btn" id="modal-cancel" data-i18n="modal_cancel">İPTAL</button>
                <button class="btn primary-btn" id="modal-save" data-i18n="modal_save">KAYDET</button>
            </div>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo">SavStudio</div>
        <div class="nav-actions">
            <button class="btn outline-btn icon-btn" id="btn-undo" title="Geri Al (Ctrl+Z)" disabled><i class="ph-bold ph-arrow-u-up-left"></i></button>
            <button class="btn outline-btn icon-btn" id="btn-redo" title="İleri Al (Ctrl+Y)" disabled><i class="ph-bold ph-arrow-u-up-right"></i></button>
            <div class="divider"></div>
            
            <label class="btn outline-btn" id="btn-compare-label" style="display:none;">
                <i class="ph-bold ph-file-dashed"></i> <span data-i18n="compare_btn">KARŞILAŞTIR</span>
                <input type="file" id="upload-compare" accept=".sav" style="display: none;">
            </label>
            
            <button class="btn lang-btn" id="lang-toggle">EN</button>
            <label class="btn primary-btn">
                <i class="ph-bold ph-upload-simple"></i> <span data-i18n="upload_btn">DOSYA YÜKLE</span>
                <input type="file" id="upload-save" accept=".sav" style="display: none;">
            </label>
            <button class="btn outline-btn" id="download-save" disabled>
                <i class="ph-bold ph-download-simple"></i> <span data-i18n="download_btn">KAYDET VE İNDİR</span>
            </button>
        </div>
    </nav>

    <main class="workspace">
        <aside class="sidebar">
            <div class="file-info" id="file-info">
                <strong data-i18n="active_file">Aktif Dosya</strong><br><br>
                <span style="color: var(--text-muted);" data-i18n="no_file">Henüz dosya seçilmedi. Düzenlemek için .sav uzantılı bir dosya yükleyin.</span>
            </div>
            
            <div class="bookmarks-panel" id="bookmarks-panel" style="display:none; margin-top: 24px;">
                <h4 style="color:var(--text-main); margin-bottom: 12px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;" data-i18n="bookmarks_title">Yer İmleri</h4>
                <div id="bookmarks-list" class="bookmarks-list"></div>
            </div>
        </aside>

        <section class="editor-area">
            <div class="tabs">
                <button class="tab active" data-target="smart-view">
                    <i class="ph-bold ph-list-numbers"></i> <span data-i18n="tab_values">Değerler</span>
                </button>
                <button class="tab" data-target="hex-view">
                    <i class="ph-bold ph-hash"></i> <span data-i18n="tab_hex">Hex Editör</span>
                </button>
            </div>

            <div class="view-content active" id="smart-view">
                <div class="empty-state" id="empty-message">
                    <i class="ph-duotone ph-file-dashed"></i>
                    <p data-i18n="empty_msg">Düzenlemeye başlamak için bir dosya yükleyin.</p>
                </div>
                <div id="smart-editor-container" style="display: none;">
                    <div class="search-box">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="Arama yap...">
                    </div>
                    <div class="smart-list" id="smart-list"></div>
                </div>
            </div>

            <div class="view-content" id="hex-view">
                <div class="hex-editor-container">
                    <div class="search-box hex-search-bar" id="hex-search-container" style="display: none; margin-bottom: 20px;">
                        <i class="ph-bold ph-magnifying-glass"></i>
                        <input type="text" id="hex-search-input" data-i18n-placeholder="hex_search_placeholder" placeholder="Hex (A1 2B) veya Metin (Player) ara...">
                        <button id="hex-search-btn" class="btn primary-btn" style="padding: 6px 16px; margin-left: 10px;" data-i18n="search_btn">BUL</button>
                    </div>

                    <div class="hex-header">
                        <div class="hex-offset-col" data-i18n="offset">Offset</div>
                        <div class="hex-bytes-col">00 01 02 03 04 05 06 07 08 09 0A 0B 0C 0D 0E 0F</div>
                        <div class="hex-ascii-col" data-i18n="ascii">ASCII</div>
                    </div>
                    <div class="hex-body" id="hex-body">
                        <div class="empty-state"><p data-i18n="empty_msg">Düzenlemeye başlamak için bir dosya yükleyin.</p></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
